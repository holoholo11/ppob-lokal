<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Login Admin - HOLOCELL</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family: Arial, sans-serif;

    background: #111827;

}

.login-box {

    width: 100%;

    max-width: 400px;

    background: white;

    padding: 30px;

    border-radius: 16px;

    box-shadow: 0 10px 30px rgba(0,0,0,.3);

}

h1 {

    text-align: center;

    margin: 0 0 8px;

}

.subtitle {

    text-align: center;

    color: #6b7280;

    margin-bottom: 25px;

}

label {

    display: block;

    margin-bottom: 6px;

    font-weight: bold;

}

input {

    width: 100%;

    padding: 13px;

    margin-bottom: 15px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    font-size: 15px;

}

button {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 8px;

    background: #111827;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

button:hover {

    opacity: .85;

}

.error {

    display: none;

    margin-bottom: 15px;

    padding: 12px;

    background: #fee2e2;

    color: #991b1b;

    border-radius: 8px;

    text-align: center;

}

</style>

</head>

<body>

<div class="login-box">

<h1>HOLOCELL</h1>

<div class="subtitle">

Login Dashboard Admin

</div>

<div
id="errorBox"
class="error"
></div>

<form
id="loginForm"
>

<label>

Password Admin

</label>

<input

type="password"

id="password"

placeholder="Masukkan password admin"

required

>

<button
type="submit"
>

🔐 Login Admin

</button>

</form>

</div>

<script>

/* ==========================================
   PASSWORD ADMIN
========================================== */

const ADMIN_PASSWORD = "@Lebak123";


/* ==========================================
   CEK JIKA SUDAH LOGIN
========================================== */

if (

sessionStorage.getItem(

"holocell_admin_login"

)

===

"true"

) {

window.location.href = "admin.html";

}


/* ==========================================
   PROSES LOGIN
========================================== */

document

.getElementById(

"loginForm"

)

.addEventListener(

"submit",

function(event) {

event.preventDefault();


const password =

document

.getElementById(

"password"

)

.value;


const errorBox =

document

.getElementById(

"errorBox"

);


if (

password

===

ADMIN_PASSWORD

) {


sessionStorage.setItem(

"holocell_admin_login",

"true"

);


window.location.href =

"admin.html";


}

else {


errorBox.style.display =

"block";


errorBox.textContent =

"Password admin salah.";


}

}

);

</script>

</body>

</html>
