<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login & Daftar - HOLOCELL</title>

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family: "DM Sans", sans-serif;

            background:

                linear-gradient(

                    135deg,

                    #f5f7ff,

                    #eef2ff

                );

        }


        .auth-container {

            width: 100%;

            max-width: 430px;

        }


        .brand {

            text-align: center;

            margin-bottom: 25px;

        }


        .brand-logo {

            width: 62px;

            height: 62px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 18px;

            color: white;

            font-size: 32px;

            font-weight: 700;

            font-family: "Space Grotesk", sans-serif;

            background:

                linear-gradient(

                    135deg,

                    #4f46e5,

                    #7c3aed

                );

            box-shadow:

                0 12px 30px

                rgba(

                    79,

                    70,

                    229,

                    .25

                );

        }


        .brand h1 {

            margin-top: 12px;

            color: #111827;

            font-family: "Space Grotesk", sans-serif;

            font-size: 25px;

        }


        .brand p {

            margin-top: 5px;

            color: #6b7280;

            font-size: 14px;

        }


        .auth-card {

            padding: 30px;

            background: white;

            border-radius: 20px;

            box-shadow:

                0 20px 60px

                rgba(

                    15,

                    23,

                    42,

                    .10

                );

        }


        .tabs {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px;

            padding: 5px;

            margin-bottom: 25px;

            border-radius: 12px;

            background: #f3f4f6;

        }


        .tab-btn {

            padding: 12px;

            border: none;

            border-radius: 9px;

            color: #6b7280;

            background: transparent;

            font-weight: 600;

            cursor: pointer;

        }


        .tab-btn.active {

            color: #111827;

            background: white;

            box-shadow:

                0 3px 10px

                rgba(

                    0,

                    0,

                    0,

                    .08

                );

        }


        .auth-form {

            display: none;

        }


        .auth-form.active {

            display: block;

        }


        .auth-form h2 {

            margin-bottom: 7px;

            color: #111827;

            font-family: "Space Grotesk", sans-serif;

        }


        .auth-form > p {

            margin-bottom: 22px;

            color: #6b7280;

            font-size: 14px;

        }


        .form-group {

            margin-bottom: 16px;

        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            color: #374151;

            font-size: 14px;

            font-weight: 600;

        }


        .form-group input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: .2s;

        }


        .form-group input:focus {

            border-color: #6366f1;

            box-shadow:

                0 0 0 3px

                rgba(

                    99,

                    102,

                    241,

                    .12

                );

        }


        .submit-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            color: white;

            background:

                linear-gradient(

                    135deg,

                    #4f46e5,

                    #7c3aed

                );

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: .2s;

        }


        .submit-btn:hover {

            transform: translateY(-1px);

            opacity: .95;

        }


        .submit-btn:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        .message {

            display: none;

            padding: 12px;

            margin-bottom: 16px;

            border-radius: 10px;

            font-size: 14px;

            line-height: 1.5;

        }


        .message.success {

            display: block;

            color: #166534;

            background: #dcfce7;

        }


        .message.error {

            display: block;

            color: #991b1b;

            background: #fee2e2;

        }


        .back-home {

            display: block;

            margin-top: 20px;

            color: #6b7280;

            text-align: center;

            text-decoration: none;

            font-size: 14px;

        }


        .back-home:hover {

            color: #4f46e5;

        }


        @media (max-width: 480px) {

            .auth-card {

                padding: 22px;

            }

        }

    </style>

</head>


<body>


    <div class="auth-container">


        <div class="brand">

            <div class="brand-logo">

                H

            </div>


            <h1>

                HOLOCELL

            </h1>


            <p>

                Layanan Digital PPOB

            </p>

        </div>


        <div class="auth-card">


            <div class="tabs">

                <button

                    type="button"

                    class="tab-btn active"

                    id="loginTab"

                >

                    Login

                </button>


                <button

                    type="button"

                    class="tab-btn"

                    id="registerTab"

                >

                    Daftar

                </button>

            </div>


            <div

                id="message"

                class="message"

            ></div>


            <!-- LOGIN -->

            <form

                id="loginForm"

                class="auth-form active"

            >

                <h2>

                    Selamat Datang 👋

                </h2>


                <p>

                    Login untuk melanjutkan ke HOLOCELL.

                </p>


                <div class="form-group">

                    <label>

                        Email

                    </label>


                    <input

                        type="email"

                        id="loginEmail"

                        placeholder="Masukkan email Anda"

                        required

                    >

                </div>


                <div class="form-group">

                    <label>

                        Password

                    </label>


                    <input

                        type="password"

                        id="loginPassword"

                        placeholder="Masukkan password"

                        required

                    >

                </div>


                <button

                    type="submit"

                    class="submit-btn"

                    id="loginButton"

                >

                    Login

                </button>

            </form>


            <!-- DAFTAR -->

            <form

                id="registerForm"

                class="auth-form"

            >

                <h2>

                    Buat Akun Baru 🚀

                </h2>


                <p>

                    Daftar untuk mulai menggunakan HOLOCELL.

                </p>


                <div class="form-group">

                    <label>

                        Nama Lengkap

                    </label>


                    <input

                        type="text"

                        id="registerName"

                        placeholder="Masukkan nama lengkap"

                        required

                    >

                </div>


                <div class="form-group">

                    <label>

                        Email

                    </label>


                    <input

                        type="email"

                        id="registerEmail"

                        placeholder="Masukkan email Anda"

                        required

                    >

                </div>


                <div class="form-group">

                    <label>

                        Password

                    </label>


                    <input

                        type="password"

                        id="registerPassword"

                        placeholder="Minimal 6 karakter"

                        minlength="6"

                        required

                    >

                </div>


                <div class="form-group">

                    <label>

                        Konfirmasi Password

                    </label>


                    <input

                        type="password"

                        id="registerConfirmPassword"

                        placeholder="Ulangi password"

                        minlength="6"

                        required

                    >

                </div>


                <button

                    type="submit"

                    class="submit-btn"

                    id="registerButton"

                >

                    Daftar Sekarang

                </button>

            </form>


        </div>


        <a

            href="index.html"

            class="back-home"

        >

            ← Kembali ke halaman utama

        </a>


    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        // ======================================
        // KONFIGURASI SUPABASE
        // ======================================

        const SUPABASE_URL =

            "https://wlitjnrhtusqndpicerk.supabase.co";


        const SUPABASE_KEY =

            "sb_publishable_NMY1WdcdPq6_GgrDv2nxEw_PIYsCyaF";


        const supabaseClient =

            window.supabase.createClient(

                SUPABASE_URL,

                SUPABASE_KEY

            );


        // ======================================
        // ELEMENT
        // ======================================

        const loginTab =

            document.getElementById(

                "loginTab"

            );


        const registerTab =

            document.getElementById(

                "registerTab"

            );


        const loginForm =

            document.getElementById(

                "loginForm"

            );


        const registerForm =

            document.getElementById(

                "registerForm"

            );


        const message =

            document.getElementById(

                "message"

            );


        const loginButton =

            document.getElementById(

                "loginButton"

            );


        const registerButton =

            document.getElementById(

                "registerButton"

            );


        // ======================================
        // TAB LOGIN
        // ======================================

        loginTab.addEventListener(

            "click",

            () => {

                loginTab.classList.add(

                    "active"

                );


                registerTab.classList.remove(

                    "active"

                );


                loginForm.classList.add(

                    "active"

                );


                registerForm.classList.remove(

                    "active"

                );


                clearMessage();

            }

        );


        // ======================================
        // TAB DAFTAR
        // ======================================

        registerTab.addEventListener(

            "click",

            () => {

                registerTab.classList.add(

                    "active"

                );


                loginTab.classList.remove(

                    "active"

                );


                registerForm.classList.add(

                    "active"

                );


                loginForm.classList.remove(

                    "active"

                );


                clearMessage();

            }

        );


        // ======================================
        // PESAN
        // ======================================

        function showMessage(

            text,

            type

        ) {

            message.textContent = text;

            message.className =

                "message " + type;

        }


        function clearMessage() {

            message.textContent = "";

            message.className =

                "message";

        }


        // ======================================
        // DAFTAR AKUN
        // ======================================

        registerForm.addEventListener(

            "submit",

            async event => {

                event.preventDefault();


                const name =

                    document

                        .getElementById(

                            "registerName"

                        )

                        .value

                        .trim();


                const email =

                    document

                        .getElementById(

                            "registerEmail"

                        )

                        .value

                        .trim();


                const password =

                    document

                        .getElementById(

                            "registerPassword"

                        )

                        .value;


                const confirmPassword =

                    document

                        .getElementById(

                            "registerConfirmPassword"

                        )

                        .value;


                if (

                    password !==

                    confirmPassword

                ) {

                    showMessage(

                        "Password dan konfirmasi password tidak sama.",

                        "error"

                    );

                    return;

                }


                registerButton.disabled =

                    true;


                registerButton.textContent =

                    "Memproses...";


                clearMessage();


                try {


                    const {

                        data,

                        error

                    } =

                        await supabaseClient

                            .auth

                            .signUp({

                                email:

                                    email,

                                password:

                                    password,

                                options: {

                                    data: {

                                        full_name:

                                            name

                                    },

                                    emailRedirectTo:

                                        window.location.origin

                                        +

                                        "/auth.html"

                                }

                            });


                    if (error) {

                        throw error;

                    }


                    showMessage(

                        "Pendaftaran berhasil! Silakan cek email Anda untuk melakukan verifikasi akun sebelum login.",

                        "success"

                    );


                    registerForm.reset();


                }


                catch (error) {


                    console.error(

                        error

                    );


                    showMessage(

                        error.message,

                        "error"

                    );

                }


                finally {

                    registerButton.disabled =

                        false;


                    registerButton.textContent =

                        "Daftar Sekarang";

                }

            }

        );


        // ======================================
        // LOGIN
        // ======================================

        loginForm.addEventListener(

            "submit",

            async event => {

                event.preventDefault();


                const email =

                    document

                        .getElementById(

                            "loginEmail"

                        )

                        .value

                        .trim();


                const password =

                    document

                        .getElementById(

                            "loginPassword"

                        )

                        .value;


                loginButton.disabled =

                    true;


                loginButton.textContent =

                    "Memproses...";


                clearMessage();


                try {


                    const {

                        data,

                        error

                    } =

                        await supabaseClient

                            .auth

                            .signInWithPassword({

                                email:

                                    email,

                                password:

                                    password

                            });


                    if (error) {

                        throw error;

                    }


                    showMessage(

                        "Login berhasil! Mengalihkan ke halaman utama...",

                        "success"

                    );


                    setTimeout(

                        () => {

                            window.location.href =

                                "index.html";

                        },

                        1000

                    );

                }


                catch (error) {


                    console.error(

                        error

                    );


                    showMessage(

                        error.message,

                        "error"

                    );

                }


                finally {

                    loginButton.disabled =

                        false;


                    loginButton.textContent =

                        "Login";

                }

            }

        );


        // ======================================
        // CEK SESSION
        // ======================================

        async function checkSession() {


            const {

                data

            } =

                await supabaseClient

                    .auth

                    .getSession();


            if (

                data.session

            ) {

                window.location.href =

                    "index.html";

            }

        }


        checkSession();


    </script>


</body>

</html>
