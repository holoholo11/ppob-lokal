<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin HOLOCELL</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 22px;
        }

        header h1 {
            margin: 0 0 5px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .stat p {
            margin: 0 0 8px;
            color: #6b7280;
        }

        .stat strong {
            font-size: 28px;
        }

        .toolbar {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .order {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .order-number {
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            background: #fef3c7;
            color: #92400e;
        }

        .order-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .info {
            background: #f9fafb;
            padding: 12px;
            border-radius: 8px;
        }

        .info small {
            display: block;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .approve {
            background: #16a34a;
            color: white;
        }

        .reject {
            background: #dc2626;
            color: white;
        }

        .paid {
            background: #2563eb;
            color: white;
        }

        .file {
            background: #7c3aed;
            color: white;
        }

        .refresh {
            background: #111827;
            color: white;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>HOLOCELL</h1>
    <p>Dashboard Admin</p>
</header>

<main class="container">

    <div id="errorBox" class="error"></div>

    <section class="stats">

        <div class="stat">
            <p>Total Pesanan</p>
            <strong id="totalOrders">0</strong>
        </div>

        <div class="stat">
            <p>Menunggu Verifikasi</p>
            <strong id="waitingOrders">0</strong>
        </div>

        <div class="stat">
            <p>Hutang Aktif</p>
            <strong id="debtOrders">0</strong>
        </div>

        <div class="stat">
            <p>Lunas</p>
            <strong id="paidOrders">0</strong>
        </div>

    </section>

    <section class="toolbar">

        <input
            type="text"
            id="searchInput"
            placeholder="Cari nama / nomor / order..."
        >

        <select id="statusFilter">

            <option value="all">
                Semua Status
            </option>

            <option value="menunggu_verifikasi">
                Menunggu Verifikasi
            </option>

            <option value="hutang_aktif">
                Hutang Aktif
            </option>

            <option value="diproses">
                Diproses
            </option>

            <option value="lunas">
                Lunas
            </option>

            <option value="ditolak">
                Ditolak
            </option>

        </select>

        <button
            class="refresh"
            onclick="loadOrders()"
        >
            🔄 Refresh
        </button>

    </section>

    <section id="ordersContainer">

        <div class="empty">
            Memuat pesanan...
        </div>

    </section>

</main>


<script>

const SUPABASE_URL =
    "https://wlitjnrhtusqndpicerk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_NMY1WdcdPq6_GgrDv2nxEw_PIYsCyaF";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let orders = [];


function rupiah(value) {

    return new Intl.NumberFormat(
        "id-ID",
        {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }
    ).format(value || 0);

}


function dateFormat(value) {

    if (!value) {

        return "-";

    }

    return new Date(value).toLocaleString(
        "id-ID"
    );

}


function showError(message) {

    const box =
        document.getElementById(
            "errorBox"
        );

    box.style.display = "block";

    box.textContent = message;

}


function hideError() {

    document
        .getElementById(
            "errorBox"
        )
        .style.display = "none";

}


async function loadOrders() {

    hideError();

    const container =
        document.getElementById(
            "ordersContainer"
        );

    container.innerHTML = `

        <div class="empty">

            Memuat pesanan...

        </div>

    `;


    const result =
        await supabaseClient

            .from("orders")

            .select("*")

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (result.error) {

        console.error(
            result.error
        );

        showError(
            "Gagal mengambil data pesanan: "
            +
            result.error.message
        );

        container.innerHTML = `

            <div class="empty">

                Gagal memuat pesanan.

            </div>

        `;

        return;

    }


    orders =
        result.data || [];


    updateStats();

    renderOrders();

}


function updateStats() {

    document
        .getElementById(
            "totalOrders"
        )
        .textContent =
        orders.length;


    document
        .getElementById(
            "waitingOrders"
        )
        .textContent =

        orders.filter(
            order =>
                order.status ===
                "menunggu_verifikasi"
        ).length;


    document
        .getElementById(
            "debtOrders"
        )
        .textContent =

        orders.filter(
            order =>
                order.status ===
                "hutang_aktif"
        ).length;


    document
        .getElementById(
            "paidOrders"
        )
        .textContent =

        orders.filter(
            order =>
                order.status ===
                "lunas"
        ).length;

}


function renderOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const status =
        document
            .getElementById(
                "statusFilter"
            )
            .value;


    const filtered =
        orders.filter(
            order => {


                const text =

                    (

                        String(
                            order.order_number
                            || ""
                        )

                        +

                        String(
                            order.customer_name
                            || ""
                        )

                        +

                        String(
                            order.target_number
                            || ""
                        )

                        +

                        String(
                            order.product_name
                            || ""
                        )

                    )

                    .toLowerCase();


                const matchSearch =
                    text.includes(
                        search
                    );


                const matchStatus =

                    status === "all"

                    ||

                    order.status ===
                    status;


                return (

                    matchSearch

                    &&

                    matchStatus

                );

            }

        );


    if (
        filtered.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                Tidak ada pesanan.

            </div>

        `;

        return;

    }


    container.innerHTML =

        filtered
            .map(
                order =>
                    orderHTML(
                        order
                    )
            )
            .join("");

}


function orderHTML(order) {

    let buttons = "";


    if (
        order.payment_proof_url
    ) {

        buttons += `

            <button
                class="file"
                onclick="openFile(
                    '${order.payment_proof_url}',
                    'payment-proofs'
                )"
            >

                📄 Bukti Pembayaran

            </button>

        `;

    }


    if (
        order.selfie_url
    ) {

        buttons += `

            <button
                class="file"
                onclick="openFile(
                    '${order.selfie_url}',
                    'debt-selfies'
                )"
            >

                🤳 Lihat Selfie

            </button>

        `;

    }


    if (
        order.status ===
        "menunggu_verifikasi"
    ) {

        buttons += `

            <button
                class="approve"
                onclick="approveOrder(
                    '${order.id}',
                    '${order.payment_method}'
                )"
            >

                ✅ Setujui

            </button>


            <button
                class="reject"
                onclick="rejectOrder(
                    '${order.id}'
                )"
            >

                ❌ Tolak

            </button>

        `;

    }


    if (
        order.status ===
        "hutang_aktif"
    ) {

        buttons += `

            <button
                class="paid"
                onclick="markPaid(
                    '${order.id}'
                )"
            >

                💰 Tandai Lunas

            </button>

        `;

    }


    return `

        <article class="order">

            <div class="order-top">

                <div class="order-number">

                    ${order.order_number || "Tanpa Nomor"}

                </div>

                <div class="status">

                    ${order.status || "-"}

                </div>

            </div>


            <div class="order-info">

                <div class="info">

                    <small>Nama Pemesan</small>

                    <strong>

                        ${order.customer_name || "-"}

                    </strong>

                </div>


                <div class="info">

                    <small>Nomor Tujuan</small>

                    <strong>

                        ${order.target_number || "-"}

                    </strong>

                </div>


                <div class="info">

                    <small>Produk</small>

                    <strong>

                        ${order.product_name || "-"}

                    </strong>

                </div>


                <div class="info">

                    <small>Total Harga</small>

                    <strong>

                        ${rupiah(
                            order.total_price
                        )}

                    </strong>

                </div>


                <div class="info">

                    <small>Metode Pembayaran</small>

                    <strong>

                        ${order.payment_method || "-"}

                    </strong>

                </div>


                <div class="info">

                    <small>Waktu Pesanan</small>

                    <strong>

                        ${dateFormat(
                            order.created_at
                        )}

                    </strong>

                </div>


                <div class="info">

                    <small>Jatuh Tempo</small>

                    <strong>

                        ${dateFormat(
                            order.due_date
                        )}

                    </strong>

                </div>

            </div>


            <div class="buttons">

                ${buttons}

            </div>

        </article>

    `;

}


async function approveOrder(
    id,
    paymentMethod
) {


    const newStatus =

        paymentMethod === "debt"

            ? "hutang_aktif"

            : "diproses";


    const result =

        await supabaseClient

            .from("orders")

            .update({

                status:
                    newStatus

            })

            .eq(
                "id",
                id
            );


    if (result.error) {

        alert(
            result.error.message
        );

        return;

    }


    alert(
        "Pesanan berhasil disetujui."
    );


    loadOrders();

}


async function rejectOrder(
    id
) {


    const result =

        await supabaseClient

            .from("orders")

            .update({

                status:
                    "ditolak"

            })

            .eq(
                "id",
                id
            );


    if (result.error) {

        alert(
            result.error.message
        );

        return;

    }


    alert(
        "Pesanan ditolak."
    );


    loadOrders();

}


async function markPaid(
    id
) {


    const result =

        await supabaseClient

            .from("orders")

            .update({

                status:
                    "lunas",

                late_fee:
                    0

            })

            .eq(
                "id",
                id
            );


    if (result.error) {

        alert(
            result.error.message
        );

        return;

    }


    alert(
        "Pesanan ditandai lunas."
    );


    loadOrders();

}


async function openFile(
    path,
    bucket
) {


    const result =

        await supabaseClient

            .storage

            .from(bucket)

            .createSignedUrl(
                path,
                3600
            );


    if (result.error) {

        alert(
            result.error.message
        );

        return;

    }


    window.open(
        result.data.signedUrl,
        "_blank"
    );

}


document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        renderOrders
    );


document
    .getElementById(
        "statusFilter"
    )
    .addEventListener(
        "change",
        renderOrders
    );


loadOrders();


setInterval(
    loadOrders,
    30000
);

</script>

</body>
</html>
